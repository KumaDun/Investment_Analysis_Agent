name: investanalysis

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: investanalysis_db
      POSTGRES_USER: investanalysis_user
      POSTGRES_PASSWORD: ${INVEST_POSTGRES_PASSWORD:?Set INVEST_POSTGRES_PASSWORD in .env}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investanalysis_user -d investanalysis_db"]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  postgres_data: